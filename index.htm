<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Oliver Spengler | System Analysis & Sound</title>
    <style>
        /* Minimalist Dark Aesthetic */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            letter-spacing: 1px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.5em;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 5px;
            border-bottom: 1px solid #222;
            display: inline-block;
            padding-bottom: 10px;
        }

        p.subtitle {
            color: #555;
            font-size: 0.8em;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Tactical Video Frame */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border: 1px solid #333;
            background: #050505;
            box-shadow: 0 0 20px rgba(255,255,255,0.03);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Navigation Links */
        .nav-links {
            margin-top: 40px;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            margin: 0 20px;
            font-size: 0.8em;
            border: 1px solid #333;
            padding: 10px 20px;
            transition: all 0.4s ease;
        }

        .nav-links a:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px #ffffff;
        }

        .system-status {
            margin-top: 60px;
            color: #222;
            font-size: 0.6em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mark Oliver Spengler</h1>
        <p class="subtitle">System Analysis // Electronic Production</p>
        
        <div class="video-wrapper">
            <!-- Featured: Chiptune XR37b -->
            <iframe 
                src="https://www.youtube.com/embed/R9L8YI6fR2I?rel=0&showinfo=0" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="nav-links">
            <a href="https://www.youtube.com/MarcOliverSpengler/videos" target="_blank">YOUTUBE</a>
            <a href="#">RELEASES</a>
            <a href="#">CONTACT</a>
        </div>

        <div class="system-status">
            Terminal Status: Active // V0.8.4_XR
        </div>
    </div>

</body>
</html>
