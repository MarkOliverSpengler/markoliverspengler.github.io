    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent: #7ab8ff;
            --link-color: #8899aa;
            --glass-bg: rgba(15, 15, 15, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg-color) url('assets/background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: 'Inter', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        /* Essential UI restrictions */
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        img { -webkit-user-drag: none; pointer-events: none; display: block; }
        ::target-text { background-color: transparent; color: inherit; }

        .main-wrapper {
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
        }

        /* Layout components */
        .header-wrap { padding: 40px 30px; display: flex; align-items: center; gap: 25px; border-bottom: 1px solid var(--glass-border); }
        .logo-container { position: relative; }
        .label-logo { height: 50px; width: auto; border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        
        .parallax-section { height: 350px; background: url('assets/banner.jpg') no-repeat center; background-size: cover; background-attachment: fixed; }
        .profile-container { text-align: center; margin-top: -100px; position: relative; z-index: 10; }
        .profile-img { width: 380px; max-width: 80%; border-radius: 12px; border: 1px solid var(--glass-border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); margin: 0 auto; }

        .roles-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 30px 0; }
        .badge { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 6px 16px; border-radius: 20px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .badge svg { width: 14px; height: 14px; fill: var(--accent); }

        .content-body { padding: 20px 60px; }
        h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin: 50px 0 20px; text-align: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .bio-text a { color: var(--link-color); text-decoration: none; border-bottom: 1px solid rgba(136, 153, 170, 0.2); }

        .albums-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 0; }
        .album-frame { display: block; border-radius: 12px; border: 1px solid var(--glass-border); transition: transform 0.3s; }
        .album-thumb { width: 100%; border-radius: 11px; }

        footer { text-align: center; padding: 60px 20px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header class="header-wrap">
            <div class="logo-container"><img src="assets/label-logo.jpg" alt="Eris Records Logo" class="label-logo"></div>
            <div>
                <h1>Mark Oliver Spengler</h1>
                <div class="site-sub">Composer & Sound Designer</div>
            </div>
        </header>

        <div class="parallax-section"></div>
        <div class="profile-container"><img src="assets/profile.jpg" alt="Portrait" class="profile-img"></div>

        <div class="roles-row">
            <div class="badge">Composer</div>
            <div class="badge">Sound Designer</div>
            <div class="badge">Producer</div>
            <div class="badge">Mastering</div>
        </div>

        <main class="content-body">
            <h2>About</h2>
            <div class="bio-text">
                <p>Mark Oliver Spengler is a composer, keyboardist and producer of electronic music...</p>
            </div>

            <h2>Featured Albums</h2>
            <div class="albums-grid">
                <a href="https://too.fm/xmppap" class="album-frame"><img src="assets/seraphim.jpg" class="album-thumb"></a>
                <a href="https://too.fm/zvzokep" class="album-frame"><img src="assets/nexus.jpg" class="album-thumb"></a>
            </div>
        </main>

        <footer>© <span id="year"></span> MARK OLIVER SPENGLER</footer>
    </div>

    <script>
        // Fix Google Scroll-to-text behavior
        window.addEventListener('load', () => {
            if (window.location.hash.includes(':~:text=')) {
                window.history.replaceState(null, null, window.location.pathname);
                window.scrollTo(0, 0);
            }
        });

        // Security & Utils
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
        });
    </script>
</body>
</html>
